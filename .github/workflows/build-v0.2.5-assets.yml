name: Legacy v0.2.5 build disabled

# v0.2.5 was published after test and frozen Tk checks failed.
# Keep the original build log in Actions history, but do not rebuild or republish.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsafe legacy release
        run: |
          echo "v0.2.5 release workflow retired; use the validated v0.2.6 candidate process." >&2
          exit 1
