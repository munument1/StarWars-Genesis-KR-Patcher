name: Restore Nexus BBCode description for Genesis 8.8.41

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Validate current file and preview Nexus metadata without editing"
        type: boolean
        required: true
        default: true

permissions:
  contents: read

jobs:
  sync-description:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout version-controlled description
        uses: actions/checkout@v4
      - name: Restore Nexus-compatible formatted description
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          script: |
            const fs = require('fs');
            const key = process.env.NEXUS_API_KEY;
            if (!key) throw new Error('Nexus API key missing');
            core.setSecret(key);
            const base = 'https://api.nexusmods.com';
            async function req(path, method = 'GET', body) {
              const response = await fetch(base + path, {
                method,
                headers: {
                  apikey: key,
                  'User-Agent': 'Genesis-KR-8841-Metadata-Sync',
                  'Content-Type': 'application/json',
                  'Cache-Control': 'no-cache'
                },
                body: body === undefined ? undefined : JSON.stringify(body),
                redirect: 'error'
              });
              if (!response.ok) {
                throw new Error(`${method} ${path} returned HTTP ${response.status}: ${(await response.text()).slice(0, 300)}`);
              }
              const raw = await response.text();
              return raw.trim() ? JSON.parse(raw) : {};
            }
            const mod = await req('/v1/games/starfield/mods/18396.json');
            if (!mod.uid) throw new Error('Nexus did not return a mod UID');
            const fileGroups = (await req(`/v3/mods/${mod.uid}/files`)).data.mod_files;
            const active = fileGroups.filter(f => f.is_active);
            if (active.length !== 1) throw new Error('Expected exactly one active file group');
            const versions = (await req(`/v3/mod-files/${active[0].id}/versions`)).data.versions;
            const good = versions.filter(v => v.version === '8.8.41-KR0.2.8' && v.category === 'main');
            if (good.length !== 1) throw new Error('Latest 8.8.41 file version is not uniquely active/main; refuse metadata edit');

            const summary = 'Star Wars Genesis - Korean Translation 한국어 번역입니다.';
            const description = fs.readFileSync('docs/nexus/description-ko-8841.bbcode.txt', 'utf8').trim();
            const sectionNames = ['■ 소개', '■ 설치 방법', '■ 주요 기능', '■ 요구 사항', '■ 감사의 말'];
            for (const title of sectionNames) {
              if (!description.includes(title)) throw new Error('Nexus section missing: ' + title);
            }
            if (description.length < 3000 || description.includes('<h2>') ||
                description.includes('<p>') || description.includes('<ul>')) {
              throw new Error('Unsafe or HTML-based Nexus description (expected BBCode)');
            }
            for (const tag of ['b', 'size', 'center', 'list', 'url']) {
              const opens = (description.match(new RegExp('\\[' + tag + '(?:=|\\])', 'g')) || []).length;
              const closes = (description.match(new RegExp('\\[/' + tag + '\\]', 'g')) || []).length;
              if (opens !== closes) throw new Error('Unbalanced BBCode ' + tag);
            }
            // Read and validate the current description before changing anything:
            // do not overwrite independent edits by the Nexus author.
            const before = await req(`/v3/mods/${mod.uid}`);
            const current = before.data;
            if (!current || typeof current.description !== 'string') throw new Error('Nexus description is unavailable');
            if (!current.description.startsWith('<h2>Star Wars Genesis 8.8.41 | Korean Translation Patcher v0.2.8')) {
              throw new Error('Current description differs from the known broken HTML; refuse to replace it');
            }
            core.info(JSON.stringify({
              mod_uid: mod.uid,
              current_mod_version: mod.version,
              newest_file_version: good[0].version,
              old_description_length: current.description.length,
              new_description_length: description.length,
              dry_run: process.env.DRY_RUN
            }));
            if (process.env.DRY_RUN === 'true') return;
            await req(`/v3/mods/${mod.uid}`, 'PATCH', { summary, description });
            const updated = (await req(`/v3/mods/${mod.uid}`)).data;
            if (!String(updated.description || '').startsWith('[center]') ||
                !String(updated.description || '').includes('■ 감사의 말') ||
                String(updated.summary || '') !== summary) {
              throw new Error('Nexus did not confirm complete BBCode restore');
            }
            core.info('Restored Korean Nexus BBCode sections and original summary, API verified');
