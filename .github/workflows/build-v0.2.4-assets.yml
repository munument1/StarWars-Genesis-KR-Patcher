name: Build verified v0.2.4 assets

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Verify release metadata, payload and installer tests
        shell: pwsh
        run: |
          python -m unittest test_installer_backend test_patch_engine test_patcher_app
          python patcher_app.py --self-check source-self-check.json
          @'
          import hashlib, json
          from pathlib import Path

          package = Path('installer-data')
          manifest = json.loads((package / 'manifest.json').read_text(encoding='utf-8'))
          assert manifest['target_version'] == '8.8.4', 'Expected Genesis 8.8.4'
          assert manifest['version'] == '0.2.4', 'Expected patcher v0.2.4'
          assert manifest['release_state'] == 'RELEASE', 'Only release-ready payloads may be published'
          assert manifest['operations'], 'No operations'
          targets = [item['target'] for item in manifest['operations']]
          assert len(targets) == len(set(targets)), 'Duplicate patch targets'
          referenced = {
              blob
              for item in manifest['operations']
              for blob in [item['blob']] + [entry['blob'] for entry in item.get('upgrade_from', [])]
          }
          present = {path.name for path in (package / 'blobs').iterdir() if path.is_file()}
          assert referenced == present, 'Orphaned or missing blobs'
          for blob in referenced:
              assert len(blob) == 64 and all(c in '0123456789abcdef' for c in blob), 'Invalid blob ID'
              assert hashlib.sha256((package / 'blobs' / blob).read_bytes()).hexdigest() == blob, 'Corrupt blob'
          print(f"Verified {len(targets)} unique operations and {len(referenced)} blobs")
          '@ | python -
      - name: Build Windows executable
        run: |
          python -m pip install -r requirements-build.txt
          python -m PyInstaller --noconfirm --onefile --windowed --name GenesisKRPatcher --add-data "installer-data;installer-data" patcher_app.py
      - name: Verify embedded payload and assemble ZIP
        shell: pwsh
        run: |
          @'
          import json, subprocess
          from pathlib import Path

          exe = Path('dist/GenesisKRPatcher.exe').resolve()
          assert exe.read_bytes()[:2] == b'MZ', 'Expected a Windows executable'
          subprocess.run([str(exe), '--self-check', str(Path('exe-self-check.json').resolve())], check=True, timeout=180)
          source = json.loads(Path('source-self-check.json').read_text(encoding='utf-8'))
          embedded = json.loads(Path('exe-self-check.json').read_text(encoding='utf-8'))
          assert embedded == source and embedded['embedded_payload_verified'], 'Embedded payload differs from source'
          assert embedded['target_version'] == '8.8.4' and embedded['version'] == '0.2.4'
          '@ | python -
          New-Item -ItemType Directory -Path package -Force | Out-Null
          Copy-Item dist/GenesisKRPatcher.exe package/
          Copy-Item README.md package/사용방법.txt
          Copy-Item docs/Pretendard-LICENSE.txt package/
          @'
          import hashlib, zipfile
          from pathlib import Path

          output = Path('GenesisKRPatcher-v0.2.4.zip')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for path in Path('package').iterdir():
                  archive.write(path, path.name)
          with zipfile.ZipFile(output) as archive:
              assert archive.testzip() is None, 'Corrupt release ZIP'
              assert set(archive.namelist()) == {'GenesisKRPatcher.exe', '사용방법.txt', 'Pretendard-LICENSE.txt'}
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          Path('SHA256SUMS-v0.2.4.txt').write_text(f'{digest}  {output.name}\n', encoding='ascii')
          '@ | python -
      - uses: actions/upload-artifact@v4
        with:
          name: verified-v0.2.4-assets
          path: |
            GenesisKRPatcher-v0.2.4.zip
            SHA256SUMS-v0.2.4.txt
            source-self-check.json
            exe-self-check.json
          if-no-files-found: error
      - name: Publish new v0.2.4 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.2.4 GenesisKRPatcher-v0.2.4.zip SHA256SUMS-v0.2.4.txt --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Star Wars Genesis 8.8.4 한국어 패처 v0.2.4" --notes-file RELEASE_NOTES.md
