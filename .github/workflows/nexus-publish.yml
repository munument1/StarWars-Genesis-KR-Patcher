name: Publish patcher to Nexus Mods

on:
  release:
    types: [published]
  workflow_run:
    workflows: ['Build verified v0.2.4 assets']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (blank selects latest stable release)'
        type: string
        required: false
      dry_run:
        description: 'Verify release and package without uploading'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: nexus-publish
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Select published patcher release
        id: release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          script: |
            const repo = context.repo;
            let release;
            if (context.eventName === 'release') {
              release = context.payload.release;
            } else if (process.env.REQUESTED_TAG) {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag: process.env.REQUESTED_TAG })).data;
            } else {
              release = (await github.rest.repos.getLatestRelease(repo)).data;
            }
            if (release.draft || release.prerelease) {
              core.setFailed('Only published stable releases can be uploaded.');
              return;
            }
            if (!/^v?\d+(?:\.\d+){1,3}$/.test(release.tag_name)) {
              core.setFailed('Expected a numeric version tag such as v1.2.3.');
              return;
            }
            if (release.tag_name !== 'v0.2.4') {
              core.notice('This workflow publishes only the Genesis 8.8.4 patcher v0.2.4.');
              return;
            }
            const assetName = `GenesisKRPatcher-${release.tag_name}.zip`;
            const checksumsName = `SHA256SUMS-${release.tag_name}.txt`;
            const asset = release.assets.find(a => a.name === assetName);
            const checksums = release.assets.find(a => a.name === checksumsName);
            if (!asset || !checksums || asset.state !== 'uploaded' || checksums.state !== 'uploaded') {
              core.setFailed('Expected patcher and checksum assets are missing or unfinished.');
              return;
            }
            // GITHUB_TOKEN-created releases do not trigger another release workflow.
            // Only mirror assets actually updated during the successful main build.
            if (context.eventName === 'workflow_run') {
              const started = Date.parse(context.payload.workflow_run.run_started_at);
              const finished = Date.parse(context.payload.workflow_run.updated_at);
              const updated = Date.parse(asset.updated_at);
              if (!(updated >= started && updated <= finished)) {
                core.notice('This build did not publish the selected release asset; skipping.');
                return;
              }
            }
            core.setOutput('ready', 'true');
            core.setOutput('tag', release.tag_name);
            core.setOutput('asset', assetName);
            core.setOutput('checksums', checksumsName);
            core.setOutput('version', '8.8.4-KR' + release.tag_name.replace(/^v/, ''));
            core.setOutput('url', release.html_url);

      - name: Download release assets
        if: steps.release.outputs.ready == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: gh release download "$TAG" --pattern "$ASSET" --pattern "$CHECKSUMS" --dir release-assets

      - name: Verify checksum and prepare ZIP
        if: steps.release.outputs.ready == 'true'
        id: package
        env:
          ASSET: ${{ steps.release.outputs.asset }}
          CHECKSUMS: ${{ steps.release.outputs.checksums }}
        run: |
          python3 - <<'PY'
          import hashlib, os, re, zipfile
          from pathlib import Path
          root = Path('release-assets')
          asset = root / os.environ['ASSET']
          expected = []
          for line in (root / os.environ['CHECKSUMS']).read_text(encoding='utf-8-sig').splitlines():
              match = re.fullmatch(r'([0-9a-fA-F]{64})\s+\*?(.+)', line)
              if match and match[2] == asset.name:
                  expected.append(match[1].lower())
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          if expected != [digest]:
              raise SystemExit('Missing, ambiguous, or mismatched SHA256 checksum')
          if asset.suffix.lower() == '.exe':
              if asset.read_bytes()[:2] != b'MZ':
                  raise SystemExit('Invalid Windows executable')
              package = asset.with_suffix('.zip')
              with zipfile.ZipFile(package, 'w', zipfile.ZIP_DEFLATED) as archive:
                  archive.write(asset, asset.name)
          else:
              package = asset
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None or not archive.namelist():
                  raise SystemExit('Invalid or empty ZIP')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'filename={package.as_posix()}\n')
          print(f'Verified {asset.name}: {digest}')
          PY

      - name: Find Nexus file and check existing versions
        if: steps.release.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        id: nexus
        uses: actions/github-script@v7
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
          VERSION: ${{ steps.release.outputs.version }}
        with:
          script: |
            const key = process.env.NEXUS_API_KEY;
            if (!key) {
              core.setFailed('Add the NEXUSMODS_API_KEY repository secret first.');
              return;
            }
            core.setSecret(key);
            async function nexus(path) {
              const response = await fetch('https://api.nexusmods.com' + path, {
                headers: { apikey: key, 'User-Agent': 'KR-Patcher-Release-Sync' },
                redirect: 'error'
              });
              if (!response.ok) throw new Error(`Nexus API returned HTTP ${response.status} for ${path}`);
              return response.json();
            }
            const mod = await nexus('/v1/games/starfield/mods/18396.json');
            if (!mod.uid) throw new Error('Nexus did not return a mod UID.');
            const files = (await nexus(`/v3/mods/${mod.uid}/files`)).data.mod_files;
            const configured = process.env.NEXUS_FILE_ID;
            const candidates = configured
              ? files.filter(f => String(f.id) === configured && f.is_active)
              : files.filter(f => f.is_active);
            if (candidates.length !== 1) {
              throw new Error('Expected one active file. Set NEXUSMODS_FILE_ID to the upload API File ID from Manage Files/Advanced.');
            }
            const fileId = String(candidates[0].id);
            const versions = (await nexus(`/v3/mod-files/${fileId}/versions`)).data.versions;
            if (versions.some(v => v.version === process.env.VERSION && !['removed', 'archived'].includes(v.category))) {
              core.notice('This version already exists on Nexus; skipping duplicate upload.');
              return;
            }
            core.setOutput('file_id', fileId);
            core.setOutput('upload', 'true');

      - name: Upload new Nexus version
        if: steps.nexus.outputs.upload == 'true'
        uses: Nexus-Mods/upload-action@c96019556046053aa26044b44396cd38929daf23 # v1.0.0-beta.10
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ steps.nexus.outputs.file_id }}
          filename: ${{ steps.package.outputs.filename }}
          version: ${{ steps.release.outputs.version }}
          display_name: 'Genesis KR Patcher ${{ steps.release.outputs.version }}'
          description: 'GitHub release: ${{ steps.release.outputs.url }}'
          category: main
          archive_existing_version: 'false'
          allow_mod_manager_download: 'false'
          update_mod_version: 'true'

      - name: Write run summary
        if: steps.release.outputs.ready == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          FILE_ID: ${{ steps.nexus.outputs.file_id }}
          UPLOADED: ${{ steps.nexus.outputs.upload }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "Release: $TAG"
            echo "Package checksum and ZIP verified."
            echo "Dry run: $DRY_RUN"
            echo "Upload performed: ${UPLOADED:-false}"
            echo "Nexus file ID: ${FILE_ID:-not selected}"
          } >> "$GITHUB_STEP_SUMMARY"
